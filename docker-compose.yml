# ============================================================================
# Knowledge2Video Docker Compose 编排
#
# 启动: docker-compose up -d --build
# 停止: docker-compose down
# 日志: docker-compose logs -f
# ============================================================================

services:
  # ==========================================================================
  # FastAPI - API 服务
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge2video-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - API_KEYS=${API_KEYS:-dev-api-key-12345}
      - DEFAULT_API=${DEFAULT_API:-claude}
      - DEBUG=${DEBUG:-false}
      - MAX_WORKERS=${MAX_WORKERS:-}
      - STORAGE_ROOT=data/outputs
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-}
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./data/outputs:/app/data/outputs
      # - ./src/api_config.json:/app/src/api_config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
